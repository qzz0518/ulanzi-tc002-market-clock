name: zerah-ulanzi-market-clock

services:
  market-clock:
    image: zerah-ulanzi-market-clock:local
    build:
      context: .
      args:
        BUN_VERSION: "1.3.14"
    restart: unless-stopped
    init: true
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      CLOCK_HOST: "${CLOCK_HOST:?CLOCK_HOST is required; run scripts/install-docker.sh or set CLOCK_HOST}"
      CONTROL_HOST: "0.0.0.0"
      APP_NAME: "${APP_NAME:-btc}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-5000}"
      SOURCE_STALE_MS: "${SOURCE_STALE_MS:-120000}"
      DISPLAY_DURATION_SECONDS: "${DISPLAY_DURATION_SECONDS:-90}"
      HEALTH_PORT: "${HEALTH_PORT:-43820}"
    ports:
      - "127.0.0.1:${HEALTH_PORT:-43820}:${HEALTH_PORT:-43820}/tcp"
    volumes:
      - ./.runtime:/app/.runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
