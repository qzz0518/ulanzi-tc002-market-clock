[tools]
bun = "1.3.14"

[tasks.build]
description = "Bundle the service and helper commands"
run = "bun run build"

[tasks.test]
description = "Run the Bun test suite"
run = "bun test"

[tasks.typecheck]
description = "Type-check the TypeScript sources"
run = "bun run typecheck"

[tasks.music-release]
description = "Validate and stage a FlyThings TC002 lyrics-player sideload bundle"
run = "bun run music-release"

[tasks.arcade-release]
description = "Validate and stage a FlyThings TC002 arcade sideload bundle"
run = "bun run arcade-release"

[tasks.install-macos]
description = "Build and install the native macOS background service"
run = "bash scripts/install.sh"

[tasks.uninstall-macos]
description = "Remove the native macOS background service"
run = "bash scripts/uninstall.sh"

[tasks.install-docker]
description = "Build and start the Docker Compose service"
run = "bash scripts/install-docker.sh"

[tasks.uninstall-docker]
description = "Stop and remove the Docker Compose service"
run = "bash scripts/uninstall-docker.sh"

[tasks.arcade-hostcheck]
description = "Compile and run the arcade engine self-checks on the host"
run = "clang++ -std=gnu++11 -Wall -Wextra -I 'device/tc002-arcade/app/src' device/tc002-arcade/hostcheck/selfcheck.cpp device/tc002-arcade/app/src/games/*.cpp device/tc002-arcade/app/src/utils/Surface.cpp -o .runtime/arcade-selfcheck && .runtime/arcade-selfcheck"
