[tools]
bun = "1.3.14"

[tasks.build]
description = "Bundle the service and helper commands"
run = "bun run build"

[tasks.test]
description = "Run the Bun test suite"
run = "bun test"

[tasks.typecheck]
description = "Type-check the TypeScript sources"
run = "bun run typecheck"

[tasks.music-release]
description = "Validate and stage a FlyThings TC002 lyrics-player sideload bundle"
run = "bun run music-release"

[tasks.arcade-release]
description = "Validate and stage a FlyThings TC002 arcade sideload bundle"
run = "bun run arcade-release"

[tasks.install-macos]
description = "Build and install the native macOS background service"
run = "bash scripts/install.sh"

[tasks.uninstall-macos]
description = "Remove the native macOS background service"
run = "bash scripts/uninstall.sh"

[tasks.install-docker]
description = "Build and start the Docker Compose service"
run = "bash scripts/install-docker.sh"

[tasks.uninstall-docker]
description = "Stop and remove the Docker Compose service"
run = "bash scripts/uninstall-docker.sh"

[tasks.arcade-hostcheck]
description = "Compile and run the arcade engine self-checks on the host"
run = "clang++ -std=gnu++11 -Wall -Wextra -I 'device/tc002-arcade/app/src' device/tc002-arcade/hostcheck/selfcheck.cpp device/tc002-arcade/app/src/games/*.cpp device/tc002-arcade/app/src/utils/Surface.cpp -o .runtime/arcade-selfcheck && .runtime/arcade-selfcheck"

# tc002-os. Everything below the device glue is FlyThings-free on purpose, so
# the UI can be compiled and asserted here rather than only on hardware.
[tasks.os-hostcheck]
description = "Compile and run the tc002-os UI self-checks on the host"
run = """
# The glyph tables are `static const` arrays in headers: every extra translation
# unit that includes them adds its own ~145 KB copy of the CJK table to a binary
# living on a device with ~1 MB free. visual/Glyphs.cpp is the only permitted
# includer, and this is the guard that keeps it that way.
includers=$(grep -rl 'shared-visual/CjkFont.h\\|shared-visual/LatinFont.h' device/tc002-os/app/src | sort)
if [ "$includers" != "device/tc002-os/app/src/visual/Glyphs.cpp" ]; then
  echo "FAIL the glyph tables must be included by visual/Glyphs.cpp alone; found:" >&2
  echo "$includers" >&2
  exit 1
fi
# The seven game engines are compiled in unchanged from the arcade tree, so its
# src is on the include path AFTER this firmware's own: utils/Surface.h resolves
# to the bridge here, visual/PixelFont.h falls through to the arcade's.
clang++ -std=gnu++11 -Wall -Wextra -I 'device/tc002-os/app/src' -I device \
  -I 'device/tc002-arcade/app/src' \
  device/tc002-os/hostcheck/selfcheck.cpp \
  device/tc002-os/app/src/core/*.cpp \
  device/tc002-os/app/src/ui/*.cpp \
  device/tc002-os/app/src/visual/*.cpp \
  device/tc002-os/app/src/net/*.cpp \
  device/tc002-os/app/src/platform/InstallMode.cpp \
  device/tc002-os/app/src/platform/ProvisionLog.cpp \
  device/tc002-arcade/app/src/games/*.cpp \
  -o .runtime/os-selfcheck && .runtime/os-selfcheck
"""

[tasks.os-build]
description = "Cross-build tc002-os to an ELF32-ARM libzkgui-os.so"
run = """
# The build id lands in /data/zos-build.id on the device (ProvisionLog): it is
# the breadcrumb that proves WHICH code is flashed, so it carries the git rev, a
# -dirty marker when the tree has uncommitted changes, and a timestamp.
rev=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
[ -n "$(git status --porcelain 2>/dev/null)" ] && rev="$rev-dirty"
docker run --rm --platform linux/amd64 -v "$PWD/device":/work \
  -w /work/tc002-lyrics-player/flythings-build flythings-build \
  make APP=../../tc002-os/app OUT=libzkgui-os.so BUILD_DIR=build-os \
    EXTRA_SRC_DIRS=../../tc002-arcade/app/src/games EXTRA_INC=../../tc002-arcade/app/src \
    EXTRA_PKGS=zknet EXTRA_LIBS=-lzknet \
    ZOS_BUILD_ID="$rev-$(date +%Y%m%d%H%M)"
"""

[tasks.os-linkaudit]
description = "Assert tc002-os only needs libraries the real device maps, and links no ffmpeg"
run = """
docker run --rm --platform linux/amd64 -v "$PWD/device":/work \
  -w /work/tc002-lyrics-player/flythings-build flythings-build \
  sh ../../tc002-os/hostcheck/link-audit.sh libzkgui-os.so libzkgui-arcade.so device-dump/maps-baseline.txt
"""

# Permanent install. Unlike os-release (which stages a /tmp sideload bundle that
# a power cycle undoes), this writes a ZKSWE container for mtd3 `res` — the
# partition the stock app is served from, with no A/B pair and no recovery slot
# behind it. The packer therefore rebuilds the stock /mnt/storage/update.img from
# its own payload first and refuses to emit anything unless the result is
# byte-identical; that round trip is the whole safety argument, so it is inside
# the task rather than a separate step someone can skip. Nothing here touches the
# device: flashing stays a deliberate human action.
[tasks.os-image]
description = "Verify the ZKSWE container spec, then pack tc002-os into a flashable update.img"
run = "bun run device/tc002-os/release/pack-image.ts"

[tasks.os-restore-image]
description = "Pack the device's LIVE /res into a restore image (the way back from a flashed ZOS)"
run = """
# Ulanzi publishes no downloadable TC002 firmware, and the update.img sitting on
# the device's UDISK partition is OLDER than what the device is actually running
# — flashing that to "restore" would silently downgrade /res. The only true
# restore point is built from the running firmware, which is what this does.
#
# adb pull does not preserve modes: /res is 0770 on the device and lands as 0644
# locally. The modes are read back from `ls -laR` and reapplied, because a
# restore image whose permissions differ from the original is not a restore.
set -e
ADB="${ADB:-adb}"
DEV="${CLOCK_ADB:-192.168.8.240:5555}"
TREE=.runtime/tc002-stock/res-live
mkdir -p .runtime/tc002-stock
rm -rf "$TREE"
"$ADB" -s "$DEV" pull /res "$TREE"
"$ADB" -s "$DEV" shell "ls -laR /res" > .runtime/tc002-stock/res-modes.txt
bun run device/tc002-os/release/restore-modes.ts .runtime/tc002-stock/res-modes.txt "$TREE"
bun run device/tc002-os/release/pack-image.ts \
  --restore "$TREE" --out .runtime/tc002-stock/restore-live.img
"""
